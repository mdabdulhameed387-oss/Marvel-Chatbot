openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: marvel
    description: Marvel-focused chat
  - name: supabase
    description: Shared Supabase connection status
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /marvel/chat:
    post:
      operationId: sendMarvelMessage
      tags: [marvel]
      summary: Ask the Marvel assistant
      description: Returns an answer to a Marvel-focused chat message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarvelChatInput"
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarvelChatReply"
        "400":
          description: Invalid chat request
        "500":
          description: The assistant could not complete the request
  /supabase/health:
    get:
      operationId: checkSupabaseConnection
      tags: [supabase]
      summary: Check the shared Supabase connection
      description: Checks Supabase connectivity without reading or changing app data.
      responses:
        "200":
          description: Supabase is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupabaseConnectionStatus"
        "503":
          description: Supabase is not configured or cannot be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupabaseConnectionStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MarvelChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 2000
      required: [role, content]
    MarvelChatInput:
      type: object
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: "#/components/schemas/MarvelChatMessage"
      required: [messages]
    MarvelChatReply:
      type: object
      properties:
        reply:
          type: string
      required: [reply]
    SupabaseConnectionStatus:
      type: object
      properties:
        connected:
          type: boolean
      required: [connected]

